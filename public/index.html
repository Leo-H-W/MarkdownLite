<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>MarkdownLite - GitHub 风格 Markdown 工作台</title>
  <!--
    三方库一律从本地 vendor/ 加载，**不要改回 CDN**：本工具会部署到不能上网的机器上，
    离线时 CDN 的 <link>/<script> 全部加载失败，window.marked 变成 undefined，
    客户端重渲染（打开文件 / 切模式 / 退出编辑）就会抛
    "Cannot read properties of undefined (reading 'parse')"。
    vendor/ 里的文件是上游 min 产物的原样副本（未做任何改动），路径按上游包内目录组织，
    只是去掉了版本号与 lib/ 这类无信息量的层级。
    升级某个库：按行尾注释里的上游包取新版本覆盖同名文件，再把该行 ?v= 的数字加一
    （与 app.js?v= / style.css?v= 同一套缓存戳约定）。
  -->
  <link rel="stylesheet" href="vendor/github-markdown-css/github-markdown.min.css?v=1"><!-- github-markdown-css@5.9.0 -->
  <!--
    这里有意不引 CodeMirror 主题：codemirror@5 的 npm 包里 theme/ 只有 65 个主题、
    没有 github（引 theme/github.min.css 会 404）。编辑器配色由 style.css 里的
    .content-wrapper .cm-* 规则提供；app.js 里保留 theme:'github' 是为了让容器
    继续带 cm-s-github 类 —— 一旦摘掉，CodeMirror 会换成 cm-s-default，
    基础主题那批 .cm-s-default .cm-* 颜色就会生效，反而改变现有观感。
  -->
  <link rel="stylesheet" href="vendor/codemirror/codemirror.min.css?v=1"><!-- codemirror@5.65.21 -->
  <link rel="stylesheet" href="style.css?v=46">
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="toolbar-left">
        <button id="btn-load-folder" class="btn-load-folder" title="选择包含 Markdown 文件的目录">&#128193; 加载文件夹...</button>
        <span id="folder-label" class="folder-label"></span>
      </div>
      <div class="toolbar-right">
        <button id="btn-new-file" class="btn" title="在当前打开的文件所在目录新建 Markdown 文件（根目录文件则建在根目录）">新文件</button>
        <button id="btn-new-tab" class="btn" title="在新标签页打开">新tab页</button>
        <button id="btn-back" class="btn" title="返回上一个文档" disabled>← 返回</button>
        <button id="btn-refresh" class="btn" title="刷新当前文件">刷新</button>
        <button id="btn-autosave" class="switch" role="switch" aria-checked="false" title="自动保存：已关闭（点击开启）">
          <span class="switch-track"><span class="switch-knob"></span></span>
          <span class="switch-label">自动保存(5s)</span>
        </button>
        <button id="btn-edit" class="btn" title="编辑当前文件">编辑</button>
        <button id="btn-mode" class="switch" role="switch" aria-checked="false" title="界面模式：传统模式（编辑 / 浏览 分离，点击切到现代模式）">
          <span class="switch-track"><span class="switch-knob"></span></span>
          <span class="switch-label">传统模式</span>
        </button>
        <span id="status" class="status"></span>
      </div>
    </header>

    <div class="main">
      <aside class="sidebar">
        <div class="resize-handle" title="拖动调整宽度"></div>
        <div class="sidebar-header">
          <span class="sidebar-title">导航</span>
          <button id="btn-toggle-toc" class="btn-toggle" title="隐藏侧边栏">&#9664;</button>
        </div>
        <div class="sidebar-view-switch">
          <button id="btn-view-files" class="view-btn active" title="浏览当前目录下的文件">文件列表</button>
          <button id="btn-view-toc" class="view-btn" title="浏览当前文档的标题目录">目录</button>
        </div>
        <div class="sidebar-panel">
          <section id="file-panel" class="file-panel">
            <div class="file-filter-bar">
              <input id="file-filter" class="file-filter" type="search" placeholder="&#128269; 过滤文件…" autocomplete="off" spellcheck="false">
            </div>
            <div class="file-list-header">
              <span>文件列表</span>
              <span id="file-count" class="file-count">0</span>
            </div>
            <nav id="file-list" class="file-list">
              <p class="file-empty">暂无内容，请先加载文件夹</p>
            </nav>
          </section>
          <section id="toc-panel" class="toc-panel" hidden>
            <nav id="toc" class="toc">
              <p class="toc-empty">暂无内容，请先加载文件夹</p>
            </nav>
          </section>
        </div>
      </aside>

      <div class="content-wrapper">
        <div class="content-scroll">
          <article id="content" class="markdown-body">
          <div class="empty-state">
            <p>点击左上角的 <strong>"📁 加载文件夹..."</strong> 按钮来加载 Markdown 文件</p>
          </div>
        </article>
        <textarea id="editor" class="markdown-editor" style="display:none;" spellcheck="false"></textarea>
        </div>
      </div>
    </div>
  </div>

  <div id="drop-overlay" class="drop-overlay hidden">
    <div class="drop-overlay-tip">&#128196; 松开鼠标，在新标签页打开 Markdown 文件 / 文件夹</div>
  </div>

  <div id="new-file-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title">新建 Markdown 文件</div>
      <div class="modal-body">
        <label class="modal-label" for="new-file-name">文件名</label>
        <input id="new-file-name" class="modal-input" type="text" placeholder="例如：note.md" autocomplete="off" spellcheck="false">
        <p id="new-file-hint" class="modal-hint"></p>
      </div>
      <div class="modal-actions">
        <button id="btn-new-file-cancel" class="btn">取消</button>
        <button id="btn-new-file-create" class="btn btn-primary">创建</button>
      </div>
    </div>
  </div>

  <div id="rename-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title">重命名文件</div>
      <div class="modal-body">
        <label class="modal-label" for="rename-name">新文件名</label>
        <input id="rename-name" class="modal-input" type="text" autocomplete="off" spellcheck="false">
        <p id="rename-hint" class="modal-hint"></p>
      </div>
      <div class="modal-actions">
        <button id="btn-rename-cancel" class="btn">取消</button>
        <button id="btn-rename-ok" class="btn btn-primary">重命名</button>
      </div>
    </div>
  </div>

  <!-- 三方库走本地 vendor/，见文件顶部说明；行尾注释是上游包，升级时按它对版本 -->
  <script src="vendor/codemirror/codemirror.min.js?v=1"></script><!-- codemirror@5.65.21 -->
  <script src="vendor/codemirror/addon/mode/overlay.min.js?v=1"></script><!-- 同上 -->
  <script src="vendor/codemirror/addon/selection/active-line.min.js?v=1"></script><!-- 同上 -->
  <!-- 列表自动续行：回车后保留 - / * / 1. / 任务框 的前缀（现代模式绑定 Enter） -->
  <script src="vendor/codemirror/addon/edit/continuelist.min.js?v=1"></script><!-- 同上 -->
  <script src="vendor/codemirror/mode/markdown/markdown.min.js?v=1"></script><!-- 同上 -->
  <script src="vendor/codemirror/mode/gfm/gfm.min.js?v=1"></script><!-- 同上 -->
  <script src="vendor/mermaid/mermaid.min.js?v=1"></script><!-- mermaid@11.17.2 -->
  <script src="vendor/marked/marked.min.js?v=1"></script><!-- marked@12.0.2 -->
  <script src="md-render.js?v=5"></script>
  <script src="app.js?v=82"></script>
</body>
</html>
